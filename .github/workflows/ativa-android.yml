name: Ativa Suporte - APK Android

# Gera o APK do Ativa Suporte (RustDesk da Ativa, so Android).
# Copia enxuta do job "build-rustdesk-android" do flutter-build.yml oficial.
#
# Assinatura: com os segredos ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD cadastrados no repositorio, o APK sai
# assinado com a chave da Ativa (atualiza por cima da versao anterior). Sem eles,
# sai assinado com uma chave de teste: instala, mas nao atualiza uma versao
# assinada com outra chave (precisa desinstalar antes).

on:
  workflow_dispatch:
  push:
    branches: [master, "claude/**"]
    paths-ignore:
      - "docs/**"
      - "**.md"

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  APP_VERSION: "1.0.${{ github.run_number }}"
  HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [generate-bridge]
    name: APK ${{ matrix.job.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: arm64, target: aarch64-linux-android, abi: arm64-v8a, ndk_script: ndk_arm64.sh, flutter_platform: android-arm64, libcxx: aarch64-linux-android }
          - { arch: armv7, target: armv7-linux-androideabi, abi: armeabi-v7a, ndk_script: ndk_arm.sh, flutter_platform: android-arm, libcxx: arm-linux-androideabi }
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib libclang-dev \
               llvm-dev nasm ninja-build openjdk-17-jdk-headless pkg-config wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.abi }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do echo "$_1:"; cat "$_1"; done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ativa-suporte-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/${{ matrix.job.ndk_script }}

      - name: Signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${HAS_SIGNING_KEY}" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ./flutter/android/app/ativa-release.jks
            {
              echo "storeFile=ativa-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > ./flutter/android/key.properties
            echo "APK assinado com a chave da Ativa."
          else
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
            echo "::warning::Sem a chave da Ativa (segredos ANDROID_KEYSTORE_*): APK de TESTE, assinado com chave temporaria."
          fi

      - name: Build APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.libcxx }}/libc++_shared.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/librustdesk.so
          cd flutter
          flutter build apk --release --target-platform ${{ matrix.job.flutter_platform }} --split-per-abi \
            --build-name "${APP_VERSION}" --build-number "$((1000 + ${{ github.run_number }}))"
          suffix=$([ "${HAS_SIGNING_KEY}" = "true" ] && echo "" || echo "-TESTE")
          mkdir -p ../out
          mv build/app/outputs/flutter-apk/app-${{ matrix.job.abi }}-release.apk \
             "../out/ativa-suporte-${APP_VERSION}-${{ matrix.job.arch }}${suffix}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ativa-suporte-${{ env.APP_VERSION }}-${{ matrix.job.arch }}
          path: out/*.apk
          retention-days: 30

      # Bibliotecas nativas desta arquitetura, para o pacote da Play Store (.aab).
      - name: Upload native libs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jnilibs-${{ matrix.job.abi }}
          path: flutter/android/app/src/main/jniLibs/${{ matrix.job.abi }}/
          retention-days: 1

  # Pacote da Google Play (.aab) com as duas arquiteturas. Instalado pela Play
  # Store, o app nao cai no bloqueio do Play Protect para apps com
  # Acessibilidade instalados fora da loja (regra do Google no Brasil).
  build-bundle:
    needs: [build-android]
    name: Pacote Google Play (.aab)
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Restore native libs (arm64)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jnilibs-arm64-v8a
          path: flutter/android/app/src/main/jniLibs/arm64-v8a/

      - name: Restore native libs (armv7)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jnilibs-armeabi-v7a
          path: flutter/android/app/src/main/jniLibs/armeabi-v7a/

      - name: Signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${HAS_SIGNING_KEY}" = "true" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ./flutter/android/app/ativa-release.jks
            {
              echo "storeFile=ativa-release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > ./flutter/android/key.properties
          else
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
            echo "::warning::Sem a chave da Ativa: o .aab de teste NAO serve para a Play Store."
          fi

      - name: Build app bundle
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          ls -R flutter/android/app/src/main/jniLibs
          cd flutter
          flutter build appbundle --release --target-platform android-arm,android-arm64 \
            --build-name "${APP_VERSION}" --build-number "$((1000 + ${{ github.run_number }}))"
          mkdir -p ../out
          suffix=$([ "${HAS_SIGNING_KEY}" = "true" ] && echo "" || echo "-TESTE")
          mv build/app/outputs/bundle/release/app-release.aab "../out/ativa-suporte-${APP_VERSION}${suffix}.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ativa-suporte-${{ env.APP_VERSION }}-google-play
          path: out/*.aab
          retention-days: 30

  # Publica os APKs na pagina de versoes (Releases): e de la que o Ativa
  # Instalador baixa e atualiza o Ativa Suporte. So APK assinado com a chave
  # da Ativa (o de TESTE nao atualizaria os celulares).
  release:
    needs: [build-android]
    name: Publicar versao (Releases)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ativa-suporte-${{ env.APP_VERSION }}-arm*
          merge-multiple: true
          path: out

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          if ls out/*TESTE*.apk >/dev/null 2>&1; then
            echo "::warning::APK de TESTE (sem a chave da Ativa): versao nao publicada."
            exit 0
          fi
          gh release create "v${APP_VERSION}" out/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Ativa Suporte ${APP_VERSION}" \
            --notes "Versao ${APP_VERSION} do Ativa Suporte. Os celulares com o Ativa Instalador atualizam sozinhos."

